{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <header class="mb-4">
        <h2>🏠 Añadir Nueva Dirección</h2>
        <p class="text-muted">Introduce los detalles de tu nueva dirección de envío.</p>
    </header>
    
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="h5 mb-0">Formulario de Dirección</h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a href="{% url 'manage_shipping_addresses' %}" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Guardar Dirección
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
